<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My profile</title>
    <style>
        body{
            margin:0;
            height:100vh;
            background-image:url(Video/flower1.jpg);
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            display:flex;
            justify-content:center;
            align-items:center;
            font-family:Arial;

        }
        .card{
            background:rgba(255,255,255,o.2);
            backdrop-filter: blur(10px);
            padding:30px;
            border-radius: 25px;
            text-align:center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .card img {
            width:200px;
            height:200px;
            object-fit:cover;
            border:5px solid  white;
            border-radius:50%;
            transition:0.5s;

        }
        .card img.hover{
            transform:scale(1.1)
            rotate(3deg);
        }
        h1{
            color:white;

        }
        button{
            padding:12px 25px;
            border:none;
            border-radius:25px;
            cursor:pointer;
            font-size:16px;
        }
        </style>

</head>
<body>
    <div class="card"
    <img src="Video/flower1.jpg" alt="" id="card">
    <h1>Welcome</h1>
    <button>Explore</button>
    </body>
</div>
</body>
</html>
